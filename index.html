<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BluSynq demos</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Schibsted+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A2540;
  font:400 16px/1.6 "Hanken Grotesk",sans-serif;color:#A9BDD0;overflow:hidden}
.glow{position:fixed;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(10,132,255,.25),transparent 65%);bottom:-420px;right:-280px;pointer-events:none}
main{position:relative;text-align:center;padding:40px;max-width:480px}
h1{font:600 30px/1.1 "Schibsted Grotesk",sans-serif;letter-spacing:-.02em;color:#fff;margin:0 0 10px}
p{margin:0 0 28px}
svg{height:38px;margin-bottom:36px}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <svg viewBox="0 0 212 48" aria-label="BluSynq">
    <defs><linearGradient id="g" x1="6" y1="42" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity=".95"/><stop offset="1" stop-color="#4DA3FF" stop-opacity=".22"/></linearGradient></defs>
    <circle cx="22" cy="24" r="11" fill="none" stroke="url(#g)" stroke-width="2.4"/>
    <circle cx="22" cy="24" r="17.5" fill="none" stroke="url(#g)" stroke-width="2.4" opacity=".6"/>
    <circle cx="22" cy="24" r="5.1" fill="#4DA3FF"/>
    <text x="52" y="32" font-family="'Schibsted Grotesk',sans-serif" font-size="30" letter-spacing="-0.9" fill="#FFFFFF"><tspan font-weight="400">Blu</tspan><tspan font-weight="700">Synq</tspan></text>
  </svg>
  <h1>Every conversation, handled.</h1>
  <p>Personalized demos live at their own links. If someone sent you here, ask them for your demo's address.</p>
</main>
</body>
</html>
